name: Build iLand

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >-
          dotnet publish iLand.csproj --configuration Release
          --runtime ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PlatformTarget=${{ matrix.arch }}
          --output publish/${{ matrix.rid }}

      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "iLand-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: iLand-${{ matrix.rid }}
          path: iLand-${{ matrix.rid }}.zip
          if-no-files-found: error
